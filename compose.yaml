name: mc714-tickets

x-postgres-env: &postgres-env
  POSTGRES_USER: tickets
  POSTGRES_PASSWORD: tickets_dev
  POSTGRES_DB: tickets

x-replica-env: &replica-env
  <<: *postgres-env
  POSTGRES_PRIMARY_HOST: postgres-primary
  POSTGRES_REPLICATION_USER: replicator
  POSTGRES_REPLICATION_PASSWORD: replicator_dev

x-postgres-health: &postgres-health
  test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

services:
  postgres-primary:
    image: postgres:16
    container_name: mc714-postgres-primary
    environment:
      <<: *postgres-env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=4
      - -c
      - hot_standby=on
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - mc714-net
    healthcheck:
      <<: *postgres-health
      start_period: 30s

  postgres-replica-1:
    image: postgres:16
    container_name: mc714-postgres-replica-1
    environment:
      <<: *replica-env
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - pgdata-replica-1:/var/lib/postgresql/data
      - ./db/replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "5433:5432"
    networks:
      - mc714-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *postgres-health
      start_period: 60s

  postgres-replica-2:
    image: postgres:16
    container_name: mc714-postgres-replica-2
    environment:
      <<: *replica-env
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - pgdata-replica-2:/var/lib/postgresql/data
      - ./db/replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "5434:5432"
    networks:
      - mc714-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *postgres-health
      start_period: 60s

  postgres-replica-3:
    image: postgres:16
    container_name: mc714-postgres-replica-3
    environment:
      <<: *replica-env
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - pgdata-replica-3:/var/lib/postgresql/data
      - ./db/replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "5435:5432"
    networks:
      - mc714-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      <<: *postgres-health
      start_period: 60s

  api:
    build:
      context: ./server
    container_name: mc714-api
    environment:
      DB_PRIMARY: postgres-primary
      DB_REPLICAS: postgres-replica-1,postgres-replica-2,postgres-replica-3
      DB_PORT: "5432"
      DB_USER: tickets
      DB_PASSWORD: tickets_dev
      DB_NAME: tickets
    ports:
      - "8000:8000"
    networks:
      - mc714-net
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
      postgres-replica-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: mc714-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - mc714-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

networks:
  mc714-net:
    name: mc714-net

volumes:
  pgdata-primary:
  pgdata-replica-1:
  pgdata-replica-2:
  pgdata-replica-3:
  pgadmin-data:
