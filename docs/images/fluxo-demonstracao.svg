<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Fluxo da demonstracao em video">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#222"/>
    </marker>
    <style type="text/css"><![CDATA[
      .blk { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.2; }
      .h2 { font: 600 13px sans-serif; fill: #111; }
      .body { font: 400 12px sans-serif; fill: #444; }
      .muted { font: 400 11px sans-serif; fill: #666; }
      .title { font: 600 15px sans-serif; fill: #111; }
      .ln { fill: none; stroke: #333; stroke-width: 1.1; marker-end: url(#arr); }
    ]]></style>
  </defs>
  <rect width="1000" height="200" fill="#fff"/>
  <text x="500" y="28" text-anchor="middle" class="title">Roteiro da demonstracao (~5 min)</text>

  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="176" height="120" rx="8" class="blk"/>
    <text x="88" y="28" text-anchor="middle" class="h2">1 Arquitetura</text>
    <text x="88" y="50" text-anchor="middle" class="body">dupla + diagrama</text>
    <text x="88" y="72" text-anchor="middle" class="muted">docs + cluster</text>
    <text x="88" y="102" text-anchor="middle" class="muted">~0:45</text>
    <path d="M176 60 H196" class="ln"/>

    <rect x="196" y="0" width="176" height="120" rx="8" class="blk"/>
    <text x="284" y="28" text-anchor="middle" class="h2">2 Cluster</text>
    <text x="284" y="50" text-anchor="middle" class="body">compose up</text>
    <text x="284" y="72" text-anchor="middle" class="muted">/health /ready</text>
    <text x="284" y="102" text-anchor="middle" class="muted">~0:45</text>
    <path d="M372 60 H392" class="ln"/>

    <rect x="392" y="0" width="176" height="120" rx="8" class="blk"/>
    <text x="480" y="28" text-anchor="middle" class="h2">3 Algoritmos</text>
    <text x="480" y="50" text-anchor="middle" class="body">Lamport Mutex 2PC</text>
    <text x="480" y="72" text-anchor="middle" class="muted">endpoints REST</text>
    <text x="480" y="102" text-anchor="middle" class="muted">~1:30</text>
    <path d="M568 60 H588" class="ln"/>

    <rect x="588" y="0" width="176" height="120" rx="8" class="blk"/>
    <text x="676" y="28" text-anchor="middle" class="h2">4 Falha</text>
    <text x="676" y="50" text-anchor="middle" class="body">stop helper</text>
    <text x="676" y="72" text-anchor="middle" class="muted">heartbeat</text>
    <text x="676" y="102" text-anchor="middle" class="muted">~1:00</text>
    <path d="M764 60 H784" class="ln"/>

    <rect x="784" y="0" width="176" height="120" rx="8" class="blk"/>
    <text x="872" y="28" text-anchor="middle" class="h2">5 Avaliacao</text>
    <text x="872" y="50" text-anchor="middle" class="body">pytest + benchmark</text>
    <text x="872" y="72" text-anchor="middle" class="muted">experiments.csv</text>
    <text x="872" y="102" text-anchor="middle" class="muted">~1:00</text>
  </g>
</svg>
