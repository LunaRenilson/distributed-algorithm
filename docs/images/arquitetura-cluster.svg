<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Arquitetura do cluster MC714">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <style type="text/css"><![CDATA[
      .box { fill: #f8f9fb; stroke: #1a1a1a; stroke-width: 1.5; }
      .db { fill: #eef4ff; stroke: #1a1a1a; stroke-width: 1.5; }
      .helper { fill: #f3f0ff; stroke: #1a1a1a; stroke-width: 1.5; }
      .title { font: 600 16px sans-serif; fill: #111; }
      .h2 { font: 600 13px sans-serif; fill: #111; }
      .sub { font: 400 12px sans-serif; fill: #444; }
      .muted { font: 400 11px sans-serif; fill: #666; }
      .group { fill: none; stroke: #bbb; stroke-width: 1; stroke-dasharray: 6 4; }
      .ln { fill: none; stroke: #333; stroke-width: 1.2; marker-end: url(#arrow); }
      .ln-d { fill: none; stroke: #666; stroke-width: 1; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    ]]></style>
  </defs>
  <rect width="920" height="520" fill="#fff"/>
  <text x="460" y="36" text-anchor="middle" class="title">Arquitetura - ingressos distribuidos (MC714 T2)</text>
  <text x="460" y="58" text-anchor="middle" class="muted">Docker Compose: API + 1 primary + 3 replicas + 3 helpers</text>

  <rect x="24" y="76" width="872" height="420" rx="10" class="group"/>
  <text x="44" y="98" class="sub">Clientes</text>

  <rect x="320" y="108" width="280" height="40" rx="8" class="box"/>
  <text x="460" y="133" text-anchor="middle" class="sub">curl | pytest | benchmark.py</text>
  <path d="M460 148 L460 172" class="ln"/>

  <rect x="250" y="172" width="420" height="64" rx="10" class="box"/>
  <text x="460" y="198" text-anchor="middle" class="h2">API FastAPI :8000</text>
  <text x="460" y="220" text-anchor="middle" class="sub">Coordenador: Lamport, Ricart-Agrawala, 2PC, Heartbeat</text>

  <path d="M340 236 L200 300" class="ln"/>
  <text x="248" y="262" class="muted">SQL</text>
  <path d="M580 236 L720 300" class="ln-d"/>
  <text x="668" y="258" class="muted">HTTP :9000</text>

  <text x="44" y="290" class="sub">PostgreSQL</text>
  <ellipse cx="160" cy="360" rx="108" ry="46" class="db"/>
  <text x="160" y="354" text-anchor="middle" class="h2">postgres-primary</text>
  <text x="160" y="374" text-anchor="middle" class="sub">escritas + log 2PC</text>

  <ellipse cx="360" cy="318" rx="88" ry="34" class="db"/>
  <text x="360" y="323" text-anchor="middle" class="sub">replica-1</text>
  <ellipse cx="360" cy="388" rx="88" ry="34" class="db"/>
  <text x="360" y="393" text-anchor="middle" class="sub">replica-2</text>
  <ellipse cx="360" cy="458" rx="88" ry="34" class="db"/>
  <text x="360" y="463" text-anchor="middle" class="sub">replica-3</text>

  <path d="M268 340 L272 318" class="ln"/>
  <path d="M268 360 L272 388" class="ln"/>
  <path d="M268 380 L272 458" class="ln"/>
  <text x="262" y="308" class="muted">streaming</text>

  <text x="640" y="290" class="sub">Helpers</text>
  <rect x="640" y="310" width="118" height="44" rx="6" class="helper"/>
  <text x="699" y="337" text-anchor="middle" class="sub">helper-node-1</text>
  <rect x="774" y="310" width="118" height="44" rx="6" class="helper"/>
  <text x="833" y="337" text-anchor="middle" class="sub">helper-node-2</text>
  <rect x="707" y="378" width="118" height="44" rx="6" class="helper"/>
  <text x="766" y="405" text-anchor="middle" class="sub">helper-node-3</text>

  <text x="460" y="502" text-anchor="middle" class="muted">GET /health /ready /databases /cluster/health</text>
</svg>
