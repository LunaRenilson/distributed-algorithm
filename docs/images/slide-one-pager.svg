  <text x="220" y="504" text-anchor="middle" class="body">log 2PC</text>

  <ellipse cx="430" cy="455" rx="82" ry="34" class="db"/>
  <text x="430" y="460" text-anchor="middle" class="body">replica-1</text>
  <ellipse cx="430" cy="525" rx="82" ry="34" class="db"/>
  <text x="430" y="530" text-anchor="middle" class="body">replica-2</text>
  <path d="M320 478 L348 455" class="ln"/>
  <path d="M320 502 L348 525" class="ln"/>
