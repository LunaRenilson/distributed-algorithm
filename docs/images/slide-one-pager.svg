      <path d="M0,0 L6,3 L0,6 Z" fill="#222"/>
    </marker>
    <style type="text/css"><![CDATA[
      .bg { fill: #ffffff; }
      .frame { fill: none; stroke: #ccc; stroke-width: 1; }
      .sec-title { font: 600 14px sans-serif; fill: #333; }
      .h1 { font: 700 22px sans-serif; fill: #111; }
      .h2 { font: 600 13px sans-serif; fill: #111; }
      .body { font: 400 12px sans-serif; fill: #444; }
