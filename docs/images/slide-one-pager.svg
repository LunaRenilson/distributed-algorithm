  <text x="62" y="638" class="mono">POST /events/ordered</text>
  <text x="62" y="656" class="mono">GET  /events/ordered</text>

  <rect x="358" y="592" width="290" height="88" rx="8" class="alg-m"/>
  <text x="503" y="618" text-anchor="middle" class="h2">Ricart-Agrawala</text>
  <text x="372" y="638" class="mono">POST /tickets/buy-mutex</text>

  <rect x="668" y="592" width="290" height="88" rx="8" class="alg-2"/>
  <text x="813" y="618" text-anchor="middle" class="h2">2PC</text>
  <text x="682" y="638" class="mono">POST /tickets/buy-2pc</text>

  <rect x="978" y="592" width="254" height="88" rx="8" class="alg-h"/>
  <text x="1105" y="618" text-anchor="middle" class="h2">Heartbeat</text>
  <text x="992" y="638" class="mono">GET /cluster/health</text>

  <text x="640" y="708" text-anchor="middle" class="muted">docs/diagrama-trabalho-mc714.md | roteiro-video.md</text>
