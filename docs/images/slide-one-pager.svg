  <text x="640" y="82" text-anchor="middle" class="muted">FastAPI | PostgreSQL (1 primary + 3 replicas) | 3 helpers | Docker Compose</text>

  <text x="48" y="118" class="sec-title">ROTEIRO DO VIDEO (~5 min)</text>
  <g transform="translate(48,128)">
