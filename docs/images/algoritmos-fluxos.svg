<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-label="Fluxos dos algoritmos distribuidos">
  <defs>
    <style type="text/css"><![CDATA[
      .card { fill: #f8f9fb; stroke: #1a1a1a; stroke-width: 1.3; }
      .accent-l { fill: #eef6ff; stroke: #1a1a1a; stroke-width: 1.3; }
      .accent-m { fill: #fff8ee; stroke: #1a1a1a; stroke-width: 1.3; }
      .accent-2 { fill: #eefaf3; stroke: #1a1a1a; stroke-width: 1.3; }
      .accent-h { fill: #fdeeee; stroke: #1a1a1a; stroke-width: 1.3; }
      .h { font: 600 13px sans-serif; fill: #111; }
      .b { font: 400 11px sans-serif; fill: #444; }
      .ep { font: 500 10px monospace; fill: #333; }
    ]]></style>
  </defs>
  <text x="460" y="24" text-anchor="middle" font-size="16" font-weight="600" font-family="sans-serif" fill="#111">Algoritmos e endpoints (demonstracao)</text>

  <rect x="24" y="44" width="200" height="200" rx="8" class="accent-l"/>
  <text x="124" y="66" text-anchor="middle" class="h">Lamport</text>
  <text x="124" y="92" text-anchor="middle" class="b">Ordenacao causal</text>
  <text x="36" y="118" class="ep">POST /events/ordered</text>
  <text x="36" y="138" class="b">clock logico crescente</text>
  <text x="36" y="158" class="ep">GET /events/ordered</text>
  <text x="36" y="178" class="b">ordem total no banco</text>

  <rect x="244" y="44" width="200" height="200" rx="8" class="accent-m"/>
  <text x="344" y="66" text-anchor="middle" class="h">Ricart-Agrawala</text>
  <text x="344" y="92" text-anchor="middle" class="b">Exclusao mutua</text>
  <text x="256" y="118" class="ep">POST /tickets/buy-mutex</text>
  <text x="256" y="138" class="b">REQUEST / REPLY nos helpers</text>
  <text x="256" y="158" class="b">Secao critica na compra</text>
  <text x="256" y="178" class="b">Metrica: critical_section_ms</text>

  <rect x="464" y="44" width="200" height="200" rx="8" class="accent-2"/>
  <text x="564" y="66" text-anchor="middle" class="h">Two-Phase Commit</text>
  <text x="564" y="92" text-anchor="middle" class="b">Transacao atomica</text>
  <text x="476" y="118" class="ep">POST /tickets/buy-2pc</text>
  <text x="476" y="138" class="b">PREPARE -&gt; COMMIT ou ABORT</text>
  <text x="476" y="158" class="b">Log em two_phase_transactions</text>
  <text x="476" y="178" class="b">(primary PostgreSQL)</text>

  <rect x="684" y="44" width="212" height="200" rx="8" class="accent-h"/>
  <text x="790" y="66" text-anchor="middle" class="h">Heartbeat</text>
  <text x="790" y="92" text-anchor="middle" class="b">Detector de falhas</text>
  <text x="696" y="118" class="ep">GET /cluster/health</text>
  <text x="696" y="138" class="b">Pings aos helpers</text>
  <text x="696" y="158" class="b">docker stop helper-node-1</text>
  <text x="696" y="178" class="b">is_alive false, depois restart</text>

  <rect x="24" y="280" width="872" height="180" rx="8" class="card"/>
  <text x="460" y="308" text-anchor="middle" class="h">Saude do cluster (Blocos 2 e 4)</text>
  <text x="460" y="336" text-anchor="middle" class="ep">GET /health /ready /databases /cluster/health</text>
  <text x="460" y="368" text-anchor="middle" class="b">docker compose up -d: 1 primary + 3 replicas + 3 helpers + API</text>
  <text x="460" y="400" text-anchor="middle" class="b">Apos falha: missed_count &gt;= 3; apos start: is_alive true</text>
  <text x="460" y="432" text-anchor="middle" class="b">Bloco 5: pytest + benchmark.py -&gt; results/experiments.csv</text>
</svg>
